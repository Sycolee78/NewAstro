[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The portfolio moved to https://emmanuel.availafrica.com (hosted on Vercel).
# Permanently redirect every path on the old Netlify address.
[[redirects]]
  from = "/*"
  to = "https://emmanuel.availafrica.com/:splat"
  status = 301
  force = true
