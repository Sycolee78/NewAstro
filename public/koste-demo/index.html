<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Koste — Interactive UI Demo</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background:
        radial-gradient(900px 600px at 80% -10%, #0F6E56 0%, transparent 55%),
        radial-gradient(700px 500px at -10% 20%, #0B5946 0%, transparent 60%),
        #063D2E;
      color: #E1F5EE;
      font-family: "DM Sans", -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #root { height: 100%; }
    /* Screen animations used by the Koste UI */
    @keyframes koste-scan {
      0%   { top: 6%; opacity: 0.4; }
      8%   { opacity: 1; }
      50%  { top: 94%; opacity: 1; }
      58%  { opacity: 0.4; }
      100% { top: 6%; opacity: 0.4; }
    }
    @keyframes koste-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes koste-caret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/koste-demo/app.js" defer></script>
</body>
</html>
